<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kalkulator Web</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap">
<style>
:root{--bg:#12142b;--panel:rgba(255,255,255,.07);--key:rgba(255,255,255,.1);--keyh:rgba(255,255,255,.18);--text:#f4f1ff;--muted:#a6a8cf;
  --acc:#ff7a59;--acc2:#ffb347;--op:#7c6cff;--b:rgba(255,255,255,.14);--err:#ff6b81}
:root[data-theme="day"]{--bg:#fdf3e7;--panel:rgba(255,255,255,.7);--key:#fff;--keyh:#f3e8ff;--text:#2a2350;--muted:#7a74a8;--b:rgba(42,35,80,.12);--op:#6a58f0}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg);color:var(--text);
  font-family:"Space Grotesk","Segoe UI",system-ui,sans-serif;font-weight:500;overflow-x:hidden;transition:background .4s}
.blob{position:fixed;border-radius:50%;filter:blur(70px);opacity:.5;z-index:0;animation:fl 14s ease-in-out infinite alternate}
.b1{width:420px;height:420px;background:var(--acc);top:-120px;left:-100px}
.b2{width:380px;height:380px;background:var(--op);bottom:-120px;right:-80px;animation-delay:-5s}
.b3{width:260px;height:260px;background:var(--acc2);top:40%;left:55%;opacity:.28;animation-delay:-9s}
@keyframes fl{to{transform:translate(70px,50px) scale(1.15)}}
@media(prefers-reduced-motion:reduce){.blob{animation:none}}
.wrap{position:relative;z-index:1;display:grid;gap:16px;width:100%;max-width:820px}
@media(min-width:760px){.wrap{grid-template-columns:1.25fr 1fr}}
.glass{background:var(--panel);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--b);border-radius:28px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.calc{padding:18px}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.head h1{font-size:15px;margin:0;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
.pills{display:flex;gap:6px}
.pill{border:1px solid var(--b);background:var(--key);color:var(--text);border-radius:999px;padding:6px 12px;font:700 12px inherit;font-family:inherit;cursor:pointer}
.screen{background:rgba(0,0,0,.18);border-radius:20px;padding:14px 16px;min-height:112px;display:flex;flex-direction:column;justify-content:flex-end;text-align:right;margin-bottom:14px;overflow:hidden}
:root[data-theme="day"] .screen{background:rgba(42,35,80,.07)}
#ex{font-size:clamp(26px,6vw,38px);font-weight:700;word-break:break-all;line-height:1.15;min-height:1.15em}
#pv{font-size:18px;color:var(--muted);min-height:24px;margin-top:4px}
#pv.err{color:var(--err)}
.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.sci{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:8px}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
button.k{border:1px solid var(--b);background:var(--key);color:var(--text);border-radius:16px;padding:0;height:54px;font:700 20px "Space Grotesk",system-ui,sans-serif;cursor:pointer;transition:transform .08s,background .15s}
.sci button.k{height:40px;font-size:14px}
button.k:hover{background:var(--keyh)}
button.k:active{transform:scale(.93)}
button.k.op{background:var(--op);color:#fff;border-color:transparent}
button.k.fn{color:var(--acc2)}
button.k.eq{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#2b1200;border-color:transparent;box-shadow:0 8px 20px rgba(255,122,89,.4)}
.hist{padding:18px;display:flex;flex-direction:column;max-height:560px}
.hist .head{margin-bottom:8px}
#list{overflow:auto;display:flex;flex-direction:column;gap:8px;flex:1}
.it{text-align:right;padding:10px 12px;border-radius:14px;background:var(--key);border:1px solid var(--b);cursor:pointer}
.it:hover{background:var(--keyh)}
.it small{display:block;color:var(--muted);font-size:13px;word-break:break-all}
.it b{font-size:20px}
.empty{color:var(--muted);text-align:center;margin:30px 0;font-size:14px}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<main class="wrap">
  <section class="calc glass">
    <div class="head">
      <h1>Kalkulator</h1>
      <div class="pills"><button class="pill" id="bDeg" onclick="toggleDeg()">DEG</button><button class="pill" id="bTheme" onclick="toggleTheme()">🌙</button></div>
    </div>
    <div class="screen" id="screen"><div id="ex">0</div><div id="pv"></div></div>
    <div class="sci" id="sci"></div>
    <div class="pad" id="pad"></div>
  </section>
  <aside class="hist glass">
    <div class="head"><h1>Riwayat</h1><button class="pill" onclick="clearHist()">Hapus</button></div>
    <div id="list"></div>
  </aside>
</main>

<script>
const $=id=>document.getElementById(id);
function load(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

let expr="",justDone=false,deg=load("kalk_deg",true),ans=0,hist=load("kalk_hist",[]);

// ==PARSER== (penghitung aman, tanpa eval)
const FN={
  sqrt:x=>{if(x<0)throw 1;return Math.sqrt(x)},
  sin:x=>Math.sin(deg?x*Math.PI/180:x),
  cos:x=>Math.cos(deg?x*Math.PI/180:x),
  tan:x=>{if(deg&&Math.abs(x%180)===90)throw 1;return Math.tan(deg?x*Math.PI/180:x)},
  log:x=>{if(x<=0)throw 1;return Math.log10(x)},
  ln:x=>{if(x<=0)throw 1;return Math.log(x)},
  abs:Math.abs
};
function calc(src){
  let t=src.replace(/\s+/g,"").replace(/×/g,"*").replace(/÷/g,"/").replace(/−/g,"-").replace(/,/g,".").replace(/π/g,"pi").replace(/√/g,"sqrt");
  const open=(t.match(/\(/g)||[]).length-(t.match(/\)/g)||[]).length;
  t+=")".repeat(Math.max(0,open));
  const re=/(\d+\.?\d*|\.\d+)|([a-z]+)|([-+*\/^()!%])/y,tk=[];let i=0,m;
  while(i<t.length){re.lastIndex=i;m=re.exec(t);if(!m)throw 1;tk.push(m[1]!==undefined?{n:parseFloat(m[1])}:m[2]?{w:m[2]}:{o:m[3]});i=re.lastIndex}
  let p=0;const peek=()=>tk[p],eat=()=>tk[p++],isO=c=>peek()&&peek().o===c;
  function E(){let v=T();while(isO("+")||isO("-")){const o=eat().o,r=T();v=o==="+"?v+r:v-r}return v}
  function T(){let v=U();while(isO("*")||isO("/")){const o=eat().o,r=U();if(o==="/"&&r===0)throw "div";v=o==="*"?v*r:v/r}return v}
  function U(){if(isO("-")){eat();return -U()}if(isO("+")){eat();return U()}return P()}
  function P(){const b=Q();if(isO("^")){eat();const e=U();if(Math.abs(e)>1000)throw 1;return Math.pow(b,e)}return b}
  function Q(){let v=A();while(isO("!")||isO("%")){if(eat().o==="%")v/=100;else{if(v<0||v!==Math.floor(v)||v>170)throw 1;let f=1;for(let k=2;k<=v;k++)f*=k;v=f}}return v}
  function A(){const x=eat();if(!x)throw 1;if(x.n!==undefined)return x.n;
    if(x.o==="("){const v=E();if(!isO(")"))throw 1;eat();return v}
    if(x.w){const w=x.w;if(w==="pi")return Math.PI;if(w==="e")return Math.E;if(w==="ans")return ans;
      if(FN[w]){if(!isO("("))throw 1;eat();const v=E();if(!isO(")"))throw 1;eat();return FN[w](v)}}
    throw 1}
  const r=E();if(p<tk.length||!isFinite(r))throw 1;return r;
}
function fmt(r){if(Math.abs(r)<1e-12)r=0;return String(+r.toPrecision(12))}
// ==END PARSER==

/* ---------- tombol ---------- */
const SCI=[["√(","fn"],["sin(","fn"],["cos(","fn"],["tan(","fn"],["^","fn"],["%","fn"],
           ["log(","fn"],["ln(","fn"],["π","fn"],["e","fn"],["!","fn"],["ans","fn"]];
const PAD=[["AC","fn"],["(",""],[")",""],["÷","op"],["7"],["8"],["9"],["×","op"],["4"],["5"],["6"],["−","op"],["1"],["2"],["3"],["+","op"],["0"],[".",""],["⌫",""],["=","eq"]];
function build(box,list){list.forEach(([k,c])=>{const b=document.createElement("button");b.className="k "+(c||"");b.textContent=k;b.onclick=()=>press(k);box.appendChild(b)})}
build($("sci"),SCI);build($("pad"),PAD);

function press(k){
  if(k==="AC"){expr="";justDone=false}
  else if(k==="⌫"){expr=justDone?"":expr.replace(/(sin\(|cos\(|tan\(|log\(|ln\(|√\(|ans)$|.$/u,"")}
  else if(k==="="){return equals()}
  else{
    const isOp=/^[+−×÷^%!]$/.test(k);
    if(justDone&&!isOp)expr="";
    if(k==="."&&/(\d*\.\d*)$/.test(expr))return;       // cegah dua titik
    expr+=k;
  }
  justDone=false;
  update();
}
function equals(){
  if(!expr)return;
  try{
    const r=calc(expr),s=fmt(r);
    hist.unshift({e:expr,r:s});hist=hist.slice(0,50);save("kalk_hist",hist);
    ans=r;expr=s;justDone=true;renderHist();update(true);
  }catch(x){
    const pv=$("pv");pv.textContent=x==="div"?"Tidak bisa dibagi nol":"Ekspresi tidak valid";pv.className="err";
    const sc=$("screen");sc.classList.remove("shake");void sc.offsetWidth;sc.classList.add("shake");
  }
}
function update(done){
  $("ex").textContent=expr||"0";
  const pv=$("pv");pv.className="";pv.textContent="";
  if(expr&&!done&&!justDone){try{const r=calc(expr);if(/[+−×÷^%!(]|[a-zπ√]/.test(expr))pv.textContent="= "+fmt(r)}catch(e){}}
}
function renderHist(){
  const l=$("list");l.innerHTML="";
  if(!hist.length){l.innerHTML='<div class="empty">Belum ada perhitungan</div>';return}
  hist.forEach(h=>{const d=document.createElement("div");d.className="it";
    const s=document.createElement("small"),b=document.createElement("b");
    s.textContent=h.e+" =";b.textContent=h.r;d.append(s,b);
    d.onclick=()=>{if(justDone)expr="";expr+=h.r;justDone=false;update()};l.appendChild(d)});
}
function clearHist(){hist=[];save("kalk_hist",hist);renderHist()}
function toggleDeg(){deg=!deg;save("kalk_deg",deg);$("bDeg").textContent=deg?"DEG":"RAD";update()}

/* ---------- tema ---------- */
let theme=load("kalk_theme",null)||(matchMedia("(prefers-color-scheme: light)").matches?"day":"night");
function applyTheme(){document.documentElement.dataset.theme=theme;$("bTheme").textContent=theme==="day"?"☀️":"🌙"}
function toggleTheme(){theme=theme==="day"?"night":"day";save("kalk_theme",theme);applyTheme()}

/* ---------- keyboard ---------- */
document.addEventListener("keydown",e=>{
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  const k=e.key,map={"*":"×","/":"÷","-":"−","Enter":"=","=":"=","Backspace":"⌫","Escape":"AC",",":"."};
  if(/^[0-9.+^()!%]$/.test(k)||map[k]){e.preventDefault();press(map[k]||k)}
});

applyTheme();$("bDeg").textContent=deg?"DEG":"RAD";renderHist();update();
</script>
</body>
</html>
